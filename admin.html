<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lead Tracker | Expert Fence</title>
<link rel="icon" href="assets/img/logo.png">
<style>
:root{--ink:#12150f;--mute:#6e756a;--line:#e6e3da;--bg:#fcfbf8;--bg2:#f2f0e9;--green:#1f4d33;--green-d:#0e2418;--cedar:#c07c33;--red:#b03a2e;--amber:#b7791f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--green)}
header{background:var(--green-d);color:#fff;padding:.8rem clamp(1rem,3vw,2rem);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header b{font-size:1.1rem;letter-spacing:.04em}header span{opacity:.7;font-size:.85rem}
header .sp{flex:1}
header button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:3px;padding:.4rem .8rem;cursor:pointer}
main{padding:1.2rem clamp(1rem,3vw,2rem) 3rem;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.2rem}
.login{max-width:420px;margin:12vh auto}
.login h1{font-size:1.4rem;margin-bottom:.4rem}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:3px;padding:.55rem .7rem;background:#fff;width:100%}
button.p{background:var(--cedar);color:#fff;border:none;border-radius:3px;padding:.6rem 1rem;font-weight:600;cursor:pointer}
button.s{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:3px;padding:.5rem .8rem;cursor:pointer}
.muted{color:var(--mute);font-size:.88rem}
.warn{background:#fdf6ec;border-left:4px solid var(--cedar);padding:.9rem 1rem;margin-bottom:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1rem}
.kpi{background:#fff;border:1px solid var(--line);border-radius:4px;padding:.8rem 1rem}
.kpi b{display:block;font-size:1.6rem;color:var(--green)}.kpi span{font-size:.8rem;color:var(--mute)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:.3rem .8rem;cursor:pointer;font-size:.85rem}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.bar input{max-width:260px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{background:var(--bg2);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
tr.row{cursor:pointer}tr.row:hover{background:#faf8f2}
.flag{display:inline-block;font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:3px;margin-left:.3rem}
.f-red{background:#fbe9e7;color:var(--red)}.f-amb{background:#fff4e0;color:var(--amber)}.f-grn{background:#e8f3ec;color:var(--green)}
td select{width:auto;padding:.3rem .4rem}
td .q{width:90px;padding:.3rem .4rem}
.detail td{background:var(--bg2)}
.hist{list-style:none;font-size:.84rem;display:grid;gap:.2rem;margin:.4rem 0 .8rem}
.hist b{color:var(--mute);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:820px){.hide-m{display:none}.grid2{grid-template-columns:1fr}th,td{font-size:.85rem;padding:.5rem .4rem}}
dialog{border:none;border-radius:6px;padding:1.2rem;max-width:520px;width:94vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:.6rem 0 .2rem}
</style>
</head>
<body>
<header><b>EXPERT FENCE</b><span>Lead tracker</span><div class="sp"></div><span id="who"></span><button id="out" hidden>Sign out</button></header>
<main id="app"><p class="muted">Loading…</p></main>

<dialog id="addDlg"><form method="dialog" id="addForm">
  <h3>Add a lead (phone, walk-in, referral)</h3>
  <div class="grid2"><div><label>Name *</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div></div>
  <div class="grid2"><div><label>Email</label><input name="email" type="email"></div><div><label>Source</label><select name="source"><option>Phone call</option><option>Walk-in at the yard</option><option>Referral</option><option>Facebook / Instagram</option><option>Google Business Profile</option><option>Other</option></select></div></div>
  <label>Address</label><input name="address">
  <label>What they need</label><input name="service" placeholder="e.g. 180 ft cedar privacy, 1 walk gate">
  <label>Notes</label><textarea name="notes" rows="3"></textarea>
  <label>Language</label><select name="lang"><option value="en">English</option><option value="es">Español</option></select>
  <p style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end"><button class="s" value="cancel" formnovalidate>Cancel</button><button class="p" value="ok">Add lead</button></p>
</form></dialog>

<script>
(function(){
var T=null, LEADS=[], STAGES=['New','Confirmed','Visit done','Quote sent','Won','Job complete','Lost','Spam'], tab='Open', q='', open=null;
var app=document.getElementById('app');
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
var m=location.hash.match(/t=([\w.-]+)/); if(m){store('efTok',m[1]);history.replaceState(null,'',location.pathname)}
T=read('efTok');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var ago=function(iso){var h=(Date.now()-Date.parse(iso))/36e5;return h<1?Math.max(1,Math.round(h*60))+' min':h<48?Math.round(h)+' h':Math.round(h/24)+' days'};
var dt=function(iso){return iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''};
var hm=function(min){var h=Math.floor(min/60),mm=min%60;return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+(h<12?' AM':' PM')};
var visit=function(l){if(!l.visit)return '';var d=new Date(l.visit.date+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' '+hm(l.visit.slot)};

function api(method,body){
  return fetch('/api/leads',{method:method,headers:Object.assign({Authorization:'Bearer '+T},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})
    .then(function(r){if(r.status===401){signOut();throw new Error('signin')}return r.json()});
}
function signOut(){store('efTok');T=null;login()}
document.getElementById('out').onclick=signOut;

function login(msg){
  document.getElementById('out').hidden=true;document.getElementById('who').textContent='';
  app.innerHTML='<div class="card login"><h1>Sign in</h1><p class="muted">Enter your Expert Fence email. We\'ll send a sign-in link that works on this device for 30 days.</p>'+
    '<form id="lf" style="margin-top:1rem;display:grid;gap:.6rem"><input type="email" id="le" placeholder="you@expertfence.com" required><button class="p">Email me a sign-in link</button></form><p id="lm" class="muted" style="margin-top:.8rem">'+(msg||'')+'</p></div>';
  document.getElementById('lf').onsubmit=function(e){e.preventDefault();
    fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('le').value})})
      .then(function(){document.getElementById('lm').textContent='If that address is allowed, a sign-in link is on its way. Check your inbox.'});};
}

function load(){
  api('GET').then(function(j){
    document.getElementById('out').hidden=false;
    if(j.configured===false){app.innerHTML='<div class="warn"><b>Almost ready.</b> The lead tracker needs its database connected in Vercel: <b>Storage → Create → Upstash for Redis → Connect to project “expert-fence-website”</b>, then redeploy. Leads keep arriving by email in the meantime.</div>';return}
    if(j.stages)STAGES=j.stages; LEADS=j.leads||[]; draw();
  }).catch(function(e){if(e.message!=='signin')app.innerHTML='<div class="warn">Could not load leads. Try again in a minute.</div>'});
}

function flags(l){
  var f='';
  if(l.stage==='New'&&Date.now()-Date.parse(l.created)>2*36e5)f+='<span class="flag f-red">waiting '+ago(l.created)+'</span>';
  if(l.stage==='Quote sent'&&l.quoteSentAt&&Date.now()-Date.parse(l.quoteSentAt)>3*864e5)f+='<span class="flag f-amb">follow up</span>';
  if(l.visit&&l.visit.date===new Date().toISOString().slice(0,10))f+='<span class="flag f-grn">visit today</span>';
  if(l.reviewSentAt)f+='<span class="flag f-grn">review asked</span>';
  return f;
}
function inTab(l){
  if(tab==='All')return l.stage!=='Spam';
  if(tab==='Open')return ['New','Confirmed','Visit done','Quote sent'].indexOf(l.stage)>=0;
  return l.stage===tab;
}
function draw(){
  var vis=LEADS.filter(inTab).filter(function(l){return !q||JSON.stringify(l).toLowerCase().indexOf(q)>=0});
  var cnt=function(s){return LEADS.filter(function(l){return l.stage===s}).length};
  var month=LEADS.filter(function(l){return Date.now()-Date.parse(l.created)<30*864e5&&l.stage!=='Spam'});
  var won=LEADS.filter(function(l){return l.wonAt&&Date.now()-Date.parse(l.wonAt)<30*864e5}).length;
  var decided=LEADS.filter(function(l){return l.stage==='Won'||l.stage==='Job complete'||l.stage==='Lost'});
  var winRate=decided.length?Math.round(100*decided.filter(function(l){return l.stage!=='Lost'}).length/decided.length)+'%':'—';
  var tabs=['Open','All'].concat(STAGES);
  app.innerHTML='<div class="kpis">'+
    '<div class="kpi"><b>'+month.length+'</b><span>Leads, last 30 days</span></div>'+
    '<div class="kpi"><b>'+LEADS.filter(function(l){return l.stage==='New'&&Date.now()-Date.parse(l.created)>2*36e5}).length+'</b><span>New, waiting 2h+</span></div>'+
    '<div class="kpi"><b>'+cnt('Quote sent')+'</b><span>Quotes out</span></div>'+
    '<div class="kpi"><b>'+won+'</b><span>Won, last 30 days</span></div>'+
    '<div class="kpi"><b>'+winRate+'</b><span>Win rate (decided quotes)</span></div></div>'+
    '<div class="bar"><div class="tabs">'+tabs.map(function(t){var n=t==='Open'?LEADS.filter(function(l){return ['New','Confirmed','Visit done','Quote sent'].indexOf(l.stage)>=0}).length:t==='All'?LEADS.filter(function(l){return l.stage!=='Spam'}).length:cnt(t);return '<button data-tab="'+t+'" class="'+(t===tab?'on':'')+'">'+t+' ('+n+')</button>'}).join('')+
    '</div><div style="flex:1"></div><input id="srch" placeholder="Search name, phone, address…" value="'+esc(q)+'"><button class="p" id="addBtn">+ Add lead</button></div>'+
    (vis.length?'<table><thead><tr><th>Received</th><th>Customer</th><th class="hide-m">Wants</th><th>Visit</th><th>Stage</th><th class="hide-m">Quote</th></tr></thead><tbody>'+
    vis.map(function(l){
      var row='<tr class="row" data-ref="'+l.ref+'"><td>'+dt(l.created)+'<div class="muted">'+esc(l.source||'')+'</div></td>'+
        '<td><b>'+esc(l.name||'(no name)')+'</b>'+flags(l)+'<div class="muted">'+(l.phone?'<a href="tel:'+esc(l.phone.replace(/[^\d+]/g,''))+'" onclick="event.stopPropagation()">'+esc(l.phone)+'</a> · ':'')+esc(l.zip||'')+(l.lang==='es'?' · ES':'')+'</div></td>'+
        '<td class="hide-m">'+esc((l.service||'').slice(0,90))+'</td><td>'+visit(l)+'</td>'+
        '<td onclick="event.stopPropagation()"><select data-stage="'+l.ref+'">'+STAGES.map(function(s){return '<option'+(s===l.stage?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td>'+
        '<td class="hide-m" onclick="event.stopPropagation()"><input class="q" data-quote="'+l.ref+'" placeholder="$" value="'+esc(l.quote||'')+'"></td></tr>';
      if(open===l.ref) row+='<tr class="detail"><td colspan="6"><div class="grid2"><div>'+
        (l.email?'<div>✉ <a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a></div>':'')+(l.address?'<div>📍 <a target="_blank" rel="noopener" href="https://maps.google.com/?q='+encodeURIComponent(l.address)+'">'+esc(l.address)+'</a></div>':'')+
        (l.notes?'<p style="margin-top:.5rem;white-space:pre-wrap">'+esc(l.notes)+'</p>':'')+'<p class="muted" style="margin-top:.5rem">Ref '+esc(l.ref)+(l.page?' · from '+esc(l.page):'')+'</p>'+
        (l.stage==='Job complete'||l.stage==='Won'?'<label style="display:flex;gap:.4rem;align-items:center;margin-top:.5rem;font-size:.85rem"><input type="checkbox" style="width:auto" data-noreview="'+l.ref+'"'+(l.noReview?' checked':'')+'> Don\'t send this customer a review request</label>':'')+
        '</div><div><ul class="hist">'+(l.history||[]).slice().reverse().map(function(h){return '<li><b>'+dt(h.t)+' · '+esc(String(h.by||'').split('@')[0])+':</b> '+esc(h.what)+'</li>'}).join('')+'</ul>'+
        '<div style="display:flex;gap:.4rem"><input data-note="'+l.ref+'" placeholder="Add a note (call outcome, next step…)"><button class="s" data-savenote="'+l.ref+'">Save</button></div></div></div></td></tr>';
      return row;
    }).join('')+'</tbody></table>':'<p class="muted">Nothing here.</p>')+
    '<p class="muted" style="margin-top:1rem">Marking a lead <b>Job complete</b> emails the customer a Google review request 2 days later. Every morning the office gets a summary of today\'s visits, unanswered requests and quotes to follow up.</p>';
  bind();
}
function update(body){return api('POST',body).then(function(j){if(j.lead){LEADS=LEADS.map(function(l){return l.ref===j.lead.ref?j.lead:l});draw()}})}
function bind(){
  app.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;draw()}});
  var s=document.getElementById('srch'); s.oninput=function(){q=s.value.toLowerCase().trim();var p=s.selectionStart;draw();var n=document.getElementById('srch');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('tr.row').forEach(function(r){r.onclick=function(){open=open===r.dataset.ref?null:r.dataset.ref;draw()}});
  app.querySelectorAll('[data-stage]').forEach(function(x){x.onchange=function(){update({ref:x.dataset.stage,stage:x.value})}});
  app.querySelectorAll('[data-quote]').forEach(function(x){x.onchange=function(){update({ref:x.dataset.quote,quote:x.value})}});
  app.querySelectorAll('[data-noreview]').forEach(function(x){x.onchange=function(){update({ref:x.dataset.noreview,noReview:x.checked})}});
  app.querySelectorAll('[data-savenote]').forEach(function(b){b.onclick=function(){var i=app.querySelector('[data-note="'+b.dataset.savenote+'"]');if(i.value.trim())update({ref:b.dataset.savenote,note:i.value.trim()})}});
  document.getElementById('addBtn').onclick=function(){document.getElementById('addDlg').showModal()};
}
document.getElementById('addDlg').addEventListener('close',function(){
  var d=this; if(d.returnValue!=='ok')return; var f=new FormData(document.getElementById('addForm')),a={};f.forEach(function(v,k){a[k]=v});
  if(!a.name)return; api('POST',{add:a}).then(function(j){if(j.lead){LEADS.unshift(j.lead);tab='Open';draw()}});document.getElementById('addForm').reset();
});
T?load():login();
})();
</script>
</body>
</html>
